<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e19;color:#fff;font-family:'Segoe UI',sans-serif;user-select:none}canvas{display:block;width:100%;height:100%}
#clock{position:absolute;text-align:center;transform:translateX(-50%);white-space:nowrap;text-shadow:0 2px 30px #0007;transition:color .7s,opacity .5s;pointer-events:none}#day{text-transform:uppercase;font-size:.155em;font-weight:600;letter-spacing:.26em;margin-bottom:.35em;color:var(--accent,#b9ed80)}#time{font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1.1}#date{font-size:.12em;letter-spacing:.18em;text-transform:uppercase;margin-top:1em;opacity:.75}#session{margin:1.6em auto 0;font-size:.125em;letter-spacing:.13em;display:none;padding:.65em 1.1em;border:1px solid #ffffff30;border-radius:2em;background:#06102144;backdrop-filter:blur(12px);width:max-content}#error{position:absolute;bottom:24px;left:24px;font:13px 'Segoe UI';color:#ffc6bd;max-width:70%}
</style></head><body><canvas id="stage"></canvas><div id="clock"><div id="day"></div><div id="time"></div><div id="date"></div><div id="session"></div></div><div id="error"></div><script src="/stage.js"></script></body></html>
